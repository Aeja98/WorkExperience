<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href= "styles/style.css"/>
    <title>Add Experience</title>
</head>
<body class="add">
  <nav>
    <h1>Din CV-Webbplats</h1> 
    <div class="menu">
      <a href="index.html">Start</a>
      <a href="add.html">Lägg till</a>
      <a href="about.html">Om</a>
    </div>
  </nav>

  <main class="addMain">
    <h2>Lägg till arbetserfarenhet</h2>

    <p id="message"></p>

    <form class="addExp" id="addExpForm">
      <label id="in1" for="companyname">Företagsnamn</label>
      <input type="text" id="companyname" placeholder="Företagsnamn">
  
      <br>
  
      <label id="in2" for="jobtitle">Arbetsroll</label>
      <input type="text" id="jobtitle" placeholder="Arbetsroll">
  
      <br>
  
      <label id="in3" for="location">Arbetsplats</label>
      <input type="text" id="location" placeholder="Arbetsplats">
  
      <br>
  
      <label id="in4" for="startdate">Startdatum</label>
      <input type="date" id="startdate">
  
      <br>

      <label id="in5" for="enddate">Slutdatum</label>
      <input type="date" id="enddate">
  
      <br>

      <label for="description">Beskrivning</label>
      <textarea id="description" placeholder="Beskriv arbetet"></textarea>

      <br>
      
      <div class="formBtn">
        <button id="submitBtn" type="submit">Spara</button>
        <button id="resetBtn" type="reset">Återställ</button>
      </div>

    </form>
  </main>

  <footer>
    <span id="footLeft">
      <h4>Angelica Adolfsson</h4>

        Email: anad2400@student.miun.se
      </p>

    </span>

        <li><a href="add.html">Lägg till</a></li>
        <li><a href="about.html">Om</a></li>
      </ul>
    </span>
  </footer>

  <script src="add.js"></script>
</body>
</html>
